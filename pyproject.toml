[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ev-forecasting"
version = "1.0.0"
description = "Production-grade EV Charging Demand Forecasting & Capacity Planning Platform"
readme = "README.md"
authors = [{ name = "ML Engineering Team" }]
license = { text = "MIT" }
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.0.0",
    "numpy>=1.24.0",
    "scipy>=1.10.0",
    "statsmodels>=0.14.0",
    "prophet>=1.1.5",
    "scikit-learn>=1.3.0",
    "xgboost>=2.0.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.0.0",
    "pandera>=0.18.0",
    "fastapi>=0.109.0",
    "uvicorn>=0.27.0",
    "streamlit>=1.30.0",
    "plotly>=5.18.0",
    "mlflow>=2.10.0",
    "sqlalchemy>=2.0.0",
    "pyyaml>=6.0",
    "requests>=2.31.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.3.0",
    "httpx>=0.27.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = [".", "src"]
addopts = "-v --strict-markers"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
